<aside class="sidebar">

  <!-- LOGO -->
  <div class="sidebar-logo">

    <div class="logo-icon">
      H
    </div>

    <div class="logo-text">
      <h2>HealthCare</h2>
      <span>Insurance</span>
    </div>

  </div>


  <!-- ADMIN -->
  <div class="admin-section">

    <div class="admin-avatar">
      A
    </div>

    <div>
      <strong>Admin</strong>
      <span>Administrator</span>
    </div>

  </div>


  <!-- NAVIGATION -->
  <nav class="sidebar-nav">

    <p class="nav-title">
      MAIN MENU
    </p>


    <!-- DASHBOARD -->

    <a
      routerLink="/admin/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >

      <span class="icon">📊</span>

      <span>
        Dashboard
      </span>

    </a>


    <!-- CUSTOMERS -->

    <a
      routerLink="/admin/customers"
      routerLinkActive="active"
      class="nav-item"
    >

      <span class="icon">👥</span>

      <span>
        Customers
      </span>

    </a>


    <!-- POLICIES -->

    <a
      routerLink="/admin/policies"
      routerLinkActive="active"
      class="nav-item"
    >

      <span class="icon">📄</span>

      <span>
        Policies
      </span>

    </a>


    <!-- POLICY PLANS -->

    <a
      routerLink="/admin/policy-plans"
      routerLinkActive="active"
      class="nav-item"
    >

      <span class="icon">📋</span>

      <span>
        Policy Plans
      </span>

    </a>


    <!-- CLAIMS -->

    <a
      routerLink="/admin/claims"
      routerLinkActive="active"
      class="nav-item"
    >

      <span class="icon">💳</span>

      <span>
        Claims
      </span>

    </a>

  </nav>


  <!-- BOTTOM -->
  <div class="sidebar-bottom">

    <button
      class="logout-button"
      type="button"
      (click)="logout()"
    >

      <span class="icon">
        🚪
      </span>

      <span>
        Logout
      </span>

    </button>

  </div>


  <!-- LOGOUT CONFIRMATION -->

  @if (showLogoutConfirmation) {

    <div class="logout-overlay">

      <div class="logout-modal">

        <div class="modal-icon">
          ⚠️
        </div>

        <h3>
          Logout?
        </h3>

        <p>
          Are you sure you want to logout from the Admin Panel?
        </p>

        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            (click)="cancelLogout()"
          >
            Cancel
          </button>

          <button
            type="button"
            class="confirm-btn"
            (click)="confirmLogout()"
          >
            Yes, Logout
          </button>

        </div>

      </div>

    </div>

  }

</aside>
